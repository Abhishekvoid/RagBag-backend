services:
  # Self-hosted cross-encoder reranker via HuggingFace Text Embeddings Inference.
  # The Django app calls POST http://localhost:8081/rerank (see utils/tei_rerank.py).
  # Reranking is an enhancement: if this service is down, the RAG pipeline falls
  # back to vector + keyword ordering and still answers.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-reranker-base"]
    ports:
      - "8081:80"
    volumes:
      - tei_rerank_cache:/data
    # Optional: set HF_TOKEN to avoid HuggingFace rate limits on first download.
    # environment:
    #   - HF_TOKEN=${HF_TOKEN}

volumes:
  tei_rerank_cache:
